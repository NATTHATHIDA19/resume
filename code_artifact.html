<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องมือสร้างและออกแบบเรซูเม่ (Thai Resume Builder)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Thai Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&family=Mitr:wght@300;400;500;600&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Font classes */
        .font-sarabun { font-family: 'Sarabun', sans-serif; }
        .font-prompt { font-family: 'Prompt', sans-serif; }
        .font-kanit { font-family: 'Kanit', sans-serif; }
        .font-mitr { font-family: 'Mitr', sans-serif; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Paper Simulation for A4 Preview */
        .a4-paper {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
            position: relative;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* PRINT STYLES */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
            }
            .no-print {
                display: none !important;
            }
            .print-area {
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .a4-paper {
                box-shadow: none !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                page-break-after: always;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }

        /* Color Picker Radio Buttons Styling */
        .color-radio:checked + label {
            ring-2: 2px;
            transform: scale(1.15);
        }
    </style>
</head>
<body class="bg-slate-100 font-sarabun min-h-screen text-slate-800 flex flex-col">

    <header class="no-print bg-slate-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-file-invoice text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Thai Resume Builder</h1>
                    <p class="text-xs text-slate-400">สร้างและออกแบบเรซูเม่ภาษาไทยอย่างมืออาชีพ</p>
                </div>
            </div>

            <!-- Global Action Controls -->
            <div class="flex items-center space-x-2">
                <button onclick="loadSampleData()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs md:text-sm font-medium rounded-lg transition flex items-center gap-1.5 text-slate-200" title="โหลดข้อมูลตัวอย่าง">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
                    <span class="hidden sm:inline">โหลดข้อมูลตัวอย่าง</span>
                </button>
                <button onclick="clearForm()" class="px-3 py-1.5 bg-slate-800 hover:bg-rose-950 hover:text-rose-300 text-xs md:text-sm font-medium rounded-lg transition text-slate-400 flex items-center gap-1.5" title="ล้างข้อมูล">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span class="hidden sm:inline">ล้างฟอร์ม</span>
                </button>
                <button onclick="exportPDF()" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs md:text-sm font-semibold rounded-lg shadow-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>ส่งออก PDF / พิมพ์</span>
                </button>
            </div>
        </div>

        <!-- Mobile View Switcher Tab -->
        <div class="flex lg:hidden border-t border-slate-800 bg-slate-900">
            <button id="btnTabEdit" onclick="switchMobileTab('edit')" class="flex-1 py-2 text-center text-sm font-medium text-blue-400 border-b-2 border-blue-500">
                <i class="fa-solid fa-pen-to-square mr-1"></i> กรอกข้อมูล
            </button>
            <button id="btnTabPreview" onclick="switchMobileTab('preview')" class="flex-1 py-2 text-center text-sm font-medium text-slate-400 border-b-2 border-transparent">
                <i class="fa-solid fa-eye mr-1"></i> ดูตัวอย่างเรซูเม่
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-[1600px] w-full mx-auto p-2 sm:p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- ==================== LEFT SIDE: FORM CONTROLS ==================== -->
        <section id="formSection" class="no-print lg:col-span-5 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col max-h-[calc(100vh-100px)] lg:sticky lg:top-20">
            
            <!-- Category Tabs -->
            <div class="flex bg-slate-50 border-b border-slate-200 overflow-x-auto text-xs font-semibold text-slate-600">
                <button onclick="switchCategory('personal')" id="catTab-personal" class="cat-tab px-4 py-3 border-b-2 border-blue-600 text-blue-600 flex items-center gap-1.5 whitespace-nowrap bg-white">
                    <i class="fa-solid fa-user"></i> ข้อมูลส่วนตัว
                </button>
                <button onclick="switchCategory('design')" id="catTab-design" class="cat-tab px-4 py-3 border-b-2 border-transparent hover:text-slate-900 flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-palette"></i> ตกแต่งดีไซน์
                </button>
                <button onclick="switchCategory('experience')" id="catTab-experience" class="cat-tab px-4 py-3 border-b-2 border-transparent hover:text-slate-900 flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-briefcase"></i> ประวัติการทำงาน
                </button>
                <button onclick="switchCategory('education')" id="catTab-education" class="cat-tab px-4 py-3 border-b-2 border-transparent hover:text-slate-900 flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-graduation-cap"></i> การศึกษา
                </button>
                <button onclick="switchCategory('skills')" id="catTab-skills" class="cat-tab px-4 py-3 border-b-2 border-transparent hover:text-slate-900 flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-star"></i> ทักษะ & ภาษา
                </button>
                <button onclick="switchCategory('projects')" id="catTab-projects" class="cat-tab px-4 py-3 border-b-2 border-transparent hover:text-slate-900 flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-diagram-project"></i> ผลงาน
                </button>
            </div>

            <!-- Form Content Scrollable Area -->
            <div class="p-5 overflow-y-auto space-y-6 flex-1">

                <!-- 1. PERSONAL INFO FORM -->
                <div id="catContent-personal" class="cat-content space-y-4">
                    <h3 class="text-base font-bold text-slate-800 border-b pb-2 flex justify-between items-center">
                        <span><i class="fa-solid fa-address-card text-blue-600 mr-2"></i>ข้อมูลส่วนตัว</span>
                    </h3>

                    <div class="flex items-center gap-4 p-3 bg-slate-50 rounded-xl border border-slate-200">
                        <img id="avatarPreview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" class="w-16 h-16 rounded-full object-cover border-2 border-white shadow-sm" alt="Profile">
                        <div class="flex-1">
                            <label class="block text-xs font-medium text-slate-600 mb-1">รูปถ่ายโปรไฟล์</label>
                            <input type="file" id="photoInput" accept="image/*" onchange="handleImageUpload(event)" class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                            <p class="text-[10px] text-slate-400 mt-1">แนะนำรูปขนาดสี่เหลี่ยมจัตุรัส</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อ - นามสกุล *</label>
                            <input type="text" id="fullName" oninput="updateData()" placeholder="เช่น สมชาย ใจดี" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">ตำแหน่งงาน / สายงาน *</label>
                            <input type="text" id="jobTitle" oninput="updateData()" placeholder="เช่น Senior Full-Stack Developer" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">อีเมล</label>
                            <input type="email" id="email" oninput="updateData()" placeholder="somchai@example.com" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">เบอร์โทรศัพท์</label>
                            <input type="text" id="phone" oninput="updateData()" placeholder="081-234-5678" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">ที่อยู่ / จังหวัด</label>
                            <input type="text" id="location" oninput="updateData()" placeholder="กรุงเทพมหานคร, ประเทศไทย" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">เว็บไซต์ / LinkedIn / GitHub</label>
                            <input type="text" id="website" oninput="updateData()" placeholder="linkedin.com/in/somchai" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">สรุปประวัติส่วนตัว / บทนำ (About Me)</label>
                        <textarea id="aboutMe" oninput="updateData()" rows="4" placeholder="อธิบายจุดเด่น สรุปประสบการณ์ และเป้าหมายในการทำงานของคุณสั้นๆ..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                    </div>
                </div>

                <!-- 2. DESIGN & CUSTOMIZATION -->
                <div id="catContent-design" class="cat-content space-y-5 hidden">
                    <h3 class="text-base font-bold text-slate-800 border-b pb-2">
                        <i class="fa-solid fa-sliders text-blue-600 mr-2"></i>ปรับแต่งการดีไซน์
                    </h3>

                    <!-- Template Selector -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-2">เลือกรูปแบบเทมเพลต (Template Style)</label>
                        <div class="grid grid-cols-2 gap-2.5">
                            <button onclick="setTemplate('modern')" id="tmplBtn-modern" class="tmpl-btn p-3 border-2 border-blue-600 bg-blue-50/50 rounded-xl text-left transition">
                                <div class="font-bold text-sm text-slate-800">Modern</div>
                                <div class="text-[11px] text-slate-500">แถบข้างโดดเด่น ทันสมัย</div>
                            </button>
                            <button onclick="setTemplate('classic')" id="tmplBtn-classic" class="tmpl-btn p-3 border border-slate-200 rounded-xl text-left transition hover:border-slate-300">
                                <div class="font-bold text-sm text-slate-800">Classic</div>
                                <div class="text-[11px] text-slate-500">เรียบร้อย เป็นทางการ</div>
                            </button>
                            <button onclick="setTemplate('minimal')" id="tmplBtn-minimal" class="tmpl-btn p-3 border border-slate-200 rounded-xl text-left transition hover:border-slate-300">
                                <div class="font-bold text-sm text-slate-800">Minimal</div>
                                <div class="text-[11px] text-slate-500">สะอาด สบายตา เน้นอ่านง่าย</div>
                            </button>
                            <button onclick="setTemplate('creative')" id="tmplBtn-creative" class="tmpl-btn p-3 border border-slate-200 rounded-xl text-left transition hover:border-slate-300">
                                <div class="font-bold text-sm text-slate-800">Creative</div>
                                <div class="text-[11px] text-slate-500">ดีไซน์ร่วมสมัย สะดุดตา</div>
                            </button>
                        </div>
                    </div>

                    <!-- Color Picker Preset -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-2">ธีมสีหลัก (Theme Color)</label>
                        <div class="flex items-center gap-3 flex-wrap">
                            <button onclick="setThemeColor('#0284c7')" class="w-8 h-8 rounded-full bg-sky-600 hover:scale-110 transition shadow-sm ring-2 ring-offset-1 ring-transparent focus:ring-sky-600"></button>
                            <button onclick="setThemeColor('#0f766e')" class="w-8 h-8 rounded-full bg-teal-700 hover:scale-110 transition shadow-sm ring-2 ring-offset-1 ring-transparent focus:ring-teal-700"></button>
                            <button onclick="setThemeColor('#4f46e5')" class="w-8 h-8 rounded-full bg-indigo-600 hover:scale-110 transition shadow-sm ring-2 ring-offset-1 ring-transparent focus:ring-indigo-600"></button>
                            <button onclick="setThemeColor('#be123c')" class="w-8 h-8 rounded-full bg-rose-700 hover:scale-110 transition shadow-sm ring-2 ring-offset-1 ring-transparent focus:ring-rose-700"></button>
                            <button onclick="setThemeColor('#1e293b')" class="w-8 h-8 rounded-full bg-slate-800 hover:scale-110 transition shadow-sm ring-2 ring-offset-1 ring-transparent focus:ring-slate-800"></button>
                            <button onclick="setThemeColor('#d97706')" class="w-8 h-8 rounded-full bg-amber-600 hover:scale-110 transition shadow-sm ring-2 ring-offset-1 ring-transparent focus:ring-amber-600"></button>
                            
                            <div class="flex items-center gap-1 border border-slate-300 rounded-lg p-1 bg-white">
                                <input type="color" id="customColorPicker" onchange="setThemeColor(this.value)" value="#0284c7" class="w-6 h-6 rounded cursor-pointer border-0">
                                <span class="text-xs text-slate-500 font-mono px-1">กำหนดเอง</span>
                            </div>
                        </div>
                    </div>

                    <!-- Font Selector -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-2">ฟอนต์ภาษาไทย (Thai Font Style)</label>
                        <select id="fontSelect" onchange="setFontStyle(this.value)" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="font-sarabun" selected>Sarabun (สารบรรณ - มาตรฐาน ชัดเจน)</option>
                            <option value="font-prompt">Prompt (พรอมต์ - ทันสมัย สไตล์โมเดิร์น)</option>
                            <option value="font-kanit">Kanit (คนิต - โดดเด่น มีพลัง)</option>
                            <option value="font-mitr">Mitr (มิตร - เป็นกันเอง อ่านง่าย)</option>
                        </select>
                    </div>

                    <!-- Layout & Spacing Controls -->
                    <div class="grid grid-cols-2 gap-4 pt-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">ขนาดฟอนต์</label>
                            <select id="fontSizeSelect" onchange="setFontSize(this.value)" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="text-xs">เล็ก (Compact)</option>
                                <option value="text-sm" selected>ปกติ (Standard)</option>
                                <option value="text-base">ใหญ่ (Large)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">ระยะขอบกระดาษ</label>
                            <select id="marginSelect" onchange="setPaperPadding(this.value)" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="p-6">แคบ (Narrow)</option>
                                <option value="p-8" selected>ปกติ (Normal)</option>
                                <option value="p-12">กว้าง (Wide)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 3. WORK EXPERIENCE FORM -->
                <div id="catContent-experience" class="cat-content space-y-4 hidden">
                    <div class="flex justify-between items-center border-b pb-2">
                        <h3 class="text-base font-bold text-slate-800">
                            <i class="fa-solid fa-briefcase text-blue-600 mr-2"></i>ประวัติการทำงาน
                        </h3>
                        <button onclick="addExperienceItem()" class="text-xs font-semibold text-blue-600 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition">
                            <i class="fa-solid fa-plus mr-1"></i>เพิ่มรายการ
                        </button>
                    </div>

                    <div id="experienceContainer" class="space-y-4">
                        <!-- Dynamic items will be injected here -->
                    </div>
                </div>

                <!-- 4. EDUCATION FORM -->
                <div id="catContent-education" class="cat-content space-y-4 hidden">
                    <div class="flex justify-between items-center border-b pb-2">
                        <h3 class="text-base font-bold text-slate-800">
                            <i class="fa-solid fa-graduation-cap text-blue-600 mr-2"></i>ประวัติการศึกษา
                        </h3>
                        <button onclick="addEducationItem()" class="text-xs font-semibold text-blue-600 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition">
                            <i class="fa-solid fa-plus mr-1"></i>เพิ่มรายการ
                        </button>
                    </div>

                    <div id="educationContainer" class="space-y-4">
                        <!-- Dynamic items will be injected here -->
                    </div>
                </div>

                <!-- 5. SKILLS & LANGUAGES -->
                <div id="catContent-skills" class="cat-content space-y-5 hidden">
                    <!-- Technical & Soft Skills -->
                    <div>
                        <div class="flex justify-between items-center border-b pb-2 mb-3">
                            <h3 class="text-base font-bold text-slate-800">
                                <i class="fa-solid fa-gears text-blue-600 mr-2"></i>ทักษะความเชี่ยวชาญ
                            </h3>
                            <button onclick="addSkillItem()" class="text-xs font-semibold text-blue-600 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition">
                                <i class="fa-solid fa-plus mr-1"></i>เพิ่มทักษะ
                            </button>
                        </div>
                        <div id="skillsContainer" class="space-y-2">
                            <!-- Skill items -->
                        </div>
                    </div>

                    <!-- Languages -->
                    <div>
                        <div class="flex justify-between items-center border-b pb-2 mb-3">
                            <h3 class="text-base font-bold text-slate-800">
                                <i class="fa-solid fa-language text-blue-600 mr-2"></i>ทักษะภาษา
                            </h3>
                            <button onclick="addLanguageItem()" class="text-xs font-semibold text-blue-600 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition">
                                <i class="fa-solid fa-plus mr-1"></i>เพิ่มภาษา
                            </button>
                        </div>
                        <div id="languagesContainer" class="space-y-2">
                            <!-- Language items -->
                        </div>
                    </div>
                </div>

                <!-- 6. PROJECTS & PORTFOLIO -->
                <div id="catContent-projects" class="cat-content space-y-4 hidden">
                    <div class="flex justify-between items-center border-b pb-2">
                        <h3 class="text-base font-bold text-slate-800">
                            <i class="fa-solid fa-laptop-code text-blue-600 mr-2"></i>โปรเจกต์ / ผลงานที่โดดเด่น
                        </h3>
                        <button onclick="addProjectItem()" class="text-xs font-semibold text-blue-600 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition">
                            <i class="fa-solid fa-plus mr-1"></i>เพิ่มโปรเจกต์
                        </button>
                    </div>

                    <div id="projectsContainer" class="space-y-4">
                        <!-- Project items -->
                    </div>
                </div>

            </div>
        </section>

        <!-- ==================== RIGHT SIDE: LIVE PREVIEW CANVAS ==================== -->

        // ==================== RESUME RENDER ENGINE ====================
        function renderResumePreview() {
            const paper = document.getElementById('resumePaper');
            const { personal, design, experiences, education, skills, languages, projects } = resumeData;
            const primaryColor = design.themeColor || '#0284c7';

            // Apply font family and padding to paper
            paper.className = `a4-paper ${design.fontFamily} ${design.fontSize} ${design.padding} transition-all duration-200`;

            // Choose template renderer
            if (design.template === 'classic') {
                paper.innerHTML = renderClassicTemplate(personal, experiences, education, skills, languages, projects, primaryColor);
            } else if (design.template === 'minimal') {
                paper.innerHTML = renderMinimalTemplate(personal, experiences, education, skills, languages, projects, primaryColor);
            } else if (design.template === 'creative') {
                paper.innerHTML = renderCreativeTemplate(personal, experiences, education, skills, languages, projects, primaryColor);
            } else {
                // Default: Modern Template
                paper.innerHTML = renderModernTemplate(personal, experiences, education, skills, languages, projects, primaryColor);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
